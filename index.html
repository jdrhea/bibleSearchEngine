<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible search engine</title>
</head>
<body>
    <script src="en_kjv.js"></script>
    <h1>Bible Dictionary</h1>
    <div class = "search">
        <input type="text" id="wordinput" name="wordinput">
        <button onclick = "initializeWordSearch()">Search</button>
    </div>
    <div class = "results">
        <p id="reusltstext">[Results]</p>
    </div>
</body>
<script>
        function initializeWordSearch()
        {
            let input = document.getElementById("wordinput").value.toLowerCase();
            console.log(searchWordinVerse(input))
        }
        function searchWordinVerse(word)
        {
            let results = 0;
            for (let book in bible)
            {
                for (let chapter in bible[book])
                {
                    for (let verse in bible[book][chapter])
                    {
                        
                        if (bible[book][chapter][verse].toLowerCase().includes(word))
                        {
                            console.log(book + " " + chapter + ":" + verse);
                            results++;
                        }
                    }
                }
            }
            return "Found: " + results + " results \n" + results/31102 * 100 + "% of verses have " + word
        
        }
</script>
</html>
