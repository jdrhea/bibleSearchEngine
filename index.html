<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible search engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="en_kjv.js"></script>
    <div class="page">
        <h1>
            <span class="g-blue">B</span><span class="g-red">i</span><span class="g-yellow">b</span><span class="g-blue">l</span><span class="g-green">e</span> Dictionary
        </h1>
        <div class = "search">
            <div class="search-box">
                <span class="search-icon">&#128269;</span>
                <input type="text" id="wordinput" name="wordinput" onkeydown="if (event.key === 'Enter') initializeWordSearch()">
            </div>
            <div class="search-buttons">
                <button onclick = "initializeWordSearch()">Bible Search</button>
            </div>
        </div>
        <div class = "results">
            <p id="resultstext">[Results]</p>
        </div>
    </div>
</body>
<script>
        function initializeWordSearch()
        {
            let references = [];
            let input = document.getElementById("wordinput").value.toLowerCase();
            searchWordinVerse(input, references);
        }
        function searchWordinVerse(word, list)
        {
            let results = 0;
            let reference;
            for (let book in bible)
            {
                for (let chapter in bible[book])
                {
                    for (let verse in bible[book][chapter])
                    {
                        if (bible[book][chapter][verse].toLowerCase().includes(word))
                        {
                            let link = createLink(book,chapter,verse);
                            let reference = "<a href=\"" + link + "\">" + book + " " + chapter + ":" + verse + "</a>"
                            list.push(reference);
                            results++;
                        }
                    }
                }
            }
            let summary = "Found: " + results + " results, " + (results / 31102 * 100).toFixed(2) + "% of verses have \"" + word + "\"";
            let result = summary + "\n" + list.join("\n");
            document.getElementById("resultstext").innerHTML = result.replace(/\n/g, "<br>");
        }
        function createLink(book,chapter,verse)
        {
            let link = "https://www.biblegateway.com/passage/?search="+book+"%"+chapter+verse+"%3A28&version=KJV";
            console.log(link);
            return link
        }
</script>
</html>
